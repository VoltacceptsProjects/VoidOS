# VoidOS glassmorphism compositor config (picom)

backend = "glx";
vsync = true;

# --- Corners ---
corner-radius = 14;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# --- Shadows ---
shadow = true;
shadow-radius = 24;
shadow-opacity = 0.45;
shadow-offset-x = -18;
shadow-offset-y = -18;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- Frosted-glass blur ---
blur-method = "dual_kawase";
blur-strength = 7;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;
blur-background-exclude = [
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- Transparency (the "glass panes") ---
inactive-opacity = 0.92;
frame-opacity = 0.85;
inactive-opacity-override = false;

opacity-rule = [
  "85:class_g = 'Xfce4-panel'",
  "85:class_g = 'Plank'",
  "88:class_g = 'Xfce4-appfinder'",
  "90:class_g = 'Xfdesktop'",
  "95:class_g = 'Xfce4-terminal'"
];

# --- Fading ---
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 6;

# --- Misc ---
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

wintypes:
{
  dock = { shadow = false; blur-background = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.92; blur-background = true; };
  dropdown_menu = { opacity = 0.92; blur-background = true; };
  tooltip = { opacity = 0.9; };
};
