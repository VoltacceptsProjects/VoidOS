# VoidOS glassmorphism compositor config (picom), "VoidUI" redesign
# Corner radius trimmed from 14 -> 10 for the window chrome. The top menu
# bar (Xfce4-panel) and VoidDock both set _NET_WM_WINDOW_TYPE_DOCK, so
# both stay window-level square via rounded-corners-exclude below -- for
# the menu bar that's the actual desired flush-edge look, and for VoidDock
# it's irrelevant either way since VoidDock draws its own rounded glass
# pill onto a fully transparent ARGB window with Cairo, not GTK chrome.

backend = "glx";
vsync = true;
# macOS-style perf: don't pay for blur/shadow compositing on a single
# maximized/fullscreen window (e.g. a video or game) -- unredirect it and
# let it hit the screen directly, same tradeoff macOS's WindowServer makes.
unredir-if-possible = true;
xrender-sync-fence = true;

# --- Corners ---
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# --- Shadows ---
shadow = true;
shadow-radius = 24;
shadow-opacity = 0.45;
shadow-offset-x = -18;
shadow-offset-y = -18;
# Only the top menu bar excludes its shadow (flush-edge look, like a real
# macOS menu bar). VoidDock is also window_type='dock' but is deliberately
# NOT excluded here -- a floating dock reads as glass, not flush, so it
# keeps picom's shadow underneath it like the real macOS Dock does.
shadow-exclude = [
  "class_g = 'Xfce4-panel'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- Frosted-glass blur ---
blur-method = "dual_kawase";
blur-strength = 7;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;
blur-background-exclude = [
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- Transparency (the "glass panes") ---
inactive-opacity = 0.92;
frame-opacity = 0.85;
inactive-opacity-override = false;

opacity-rule = [
  "85:class_g = 'Xfce4-panel'",
  "88:class_g = 'Xfce4-appfinder'",
  "90:class_g = 'Xfdesktop'",
  "95:class_g = 'Xfce4-terminal'"
];

# --- Fading ---
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 6;

# --- Misc ---
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

wintypes:
{
  # shadow left at the top-level default (true) here on purpose -- the
  # menu bar's shadow is turned off above by class (Xfce4-panel), not by
  # wintype, so VoidDock (also window_type='dock') still casts one.
  dock = { blur-background = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.92; blur-background = true; };
  dropdown_menu = { opacity = 0.92; blur-background = true; };
  tooltip = { opacity = 0.9; };
};
