# picom configuration suitable for VoidUI vibrancy
backend = "glx";
vsync = true;
detect-client-opacity = true;
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.45;

# rounded corners for windows
corner-radius = 12;

# blur
blur-method = "dual_kawase";
blur-strength = 8;

# fade windows
fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;

# exclude certain windows from blur/shadow (panels, docks, popups)
# This will keep the panel crisp while making app windows vibrancy-glass
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];
