<?xml version="1.0" encoding="UTF-8"?>
<!--
  VoidOS default wallpaper (VoidUI redesign).
  Kept as an .svg wrapper (per README: "Change wallpaper: replace
  .../wallpaper.svg") so the documented path/filename still holds, but it
  now just frames the real photo shipped alongside it as wallpaper.jpg.
  Source photo is 1280x720 (16:9), same aspect as the 1920x1080 canvas
  below, so it maps edge-to-edge with no cropping or distortion.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1920" height="1080" viewBox="0 0 1920 1080">
  <image x="0" y="0" width="1920" height="1080"
         preserveAspectRatio="xMidYMid slice"
         xlink:href="wallpaper.jpg" href="wallpaper.jpg"/>
</svg>
