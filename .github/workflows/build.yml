name: Build VoidOS ISO

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}   # lets you click "Run workflow" manually in the Actions tab

concurrency:
  group: build-voidos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ISO (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout VoidOS source
        uses: actions/checkout@v4

      - name: Free up disk space on the runner
        # live-build needs real headroom (a full Debian chroot + squashfs + ISO)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install live-build and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            dosfstools \
            mtools

      - name: Show live-build version
        run: lb --version || true

      - name: Clean any previous build state
        run: sudo lb clean --purge
        working-directory: .

      - name: Generate live-build config from auto/config
        # lb build only reads config/ once it's been populated (distribution,
        # architecture, etc.). `lb config` alone only auto-runs auto/config if
        # that file is marked executable in the repo - which isn't guaranteed
        # (e.g. it's lost if files were pushed via GitHub's web upload instead
        # of `git push`). So we force the bit and call the script directly.
        run: |
          chmod +x auto/config
          sudo ./auto/config
        working-directory: .

      - name: Verify the config targets Debian bookworm
        # Fail fast (instead of 30 minutes into a build) if auto/config didn't
        # actually apply. Live-build 3.x splits settings across config/bootstrap,
        # config/common etc. - LB_DISTRIBUTION lives in config/bootstrap, and
        # LB_MODE (which controls mirror/keyring - must be "debian", not the
        # host's own "ubuntu" default) lives in config/common.
        run: |
          MODE_OK=0; DIST_OK=0; SEC_OK=0
          grep -q '^LB_MODE="debian"' config/common 2>/dev/null && MODE_OK=1
          grep -q '^LB_DISTRIBUTION="bookworm"' config/bootstrap 2>/dev/null && DIST_OK=1
          grep -q '^LB_SECURITY="false"' config/bootstrap config/common config/chroot config/binary 2>/dev/null && SEC_OK=1
          if [ "$MODE_OK" != "1" ] || [ "$DIST_OK" != "1" ] || [ "$SEC_OK" != "1" ]; then
            echo "::error::auto/config did not apply correctly (mode_ok=$MODE_OK dist_ok=$DIST_OK sec_ok=$SEC_OK)."
            echo "--- config/bootstrap ---"; cat config/bootstrap 2>/dev/null || echo "(missing)"
            echo "--- config/common ---"; cat config/common 2>/dev/null || echo "(missing)"
            exit 1
          fi
          echo "Confirmed: Debian mode, targeting bookworm, security repo disabled."

      - name: Work around missing 'rsvg' binary in live-build's syslinux step
        # Ubuntu's "live-build" apt package is a very old snapshot (3.0~a57,
        # from 2012). Its binary_syslinux script still shells out to the
        # legacy `rsvg` command to render config/bootloaders/isolinux/splash.svg.in
        # into splash.png. Modern librsvg2-bin (2.x, pulled in automatically
        # during this stage since we target bookworm) only ships `rsvg-convert`
        # -- the plain `rsvg` CLI was dropped from the package years ago.
        # Without it, live-build hits "/usr/bin/env: 'rsvg': No such file or
        # directory", silently aborts partway through, and no .iso is produced
        # (the failure doesn't surface until the later "no ISO was produced"
        # check, since `lb build`'s exit code is swallowed by `tee`).
        #
        # Fix: provide a tiny `rsvg` shim on PATH that forwards to
        # `rsvg-convert`, translating the old positional "infile outfile"
        # calling convention into `rsvg-convert ... -o outfile infile`.
        run: |
          sudo tee /usr/local/bin/rsvg > /dev/null <<'EOF'
          #!/bin/bash
          # Compatibility shim: old `rsvg` CLI -> modern `rsvg-convert`.
          args=()
          positional=()
          have_o=0
          while [ $# -gt 0 ]; do
            case "$1" in
              -o|--output)
                have_o=1
                args+=("$1" "$2")
                shift 2
                ;;
              -*)
                args+=("$1")
                shift
                ;;
              *)
                positional+=("$1")
                shift
                ;;
            esac
          done
          if [ "$have_o" -eq 0 ] && [ "${#positional[@]}" -eq 2 ]; then
            exec rsvg-convert "${args[@]}" -o "${positional[1]}" "${positional[0]}"
          else
            exec rsvg-convert "${args[@]}" "${positional[@]}"
          fi
          EOF
          sudo chmod +x /usr/local/bin/rsvg

      - name: Build the VoidOS ISO
        env:
          LB_APT_INDICES: "false"
        run: set -o pipefail; sudo lb build 2>&1 | tee build.log
        working-directory: .

      - name: Rename ISO with version/commit info
        run: |
          ISO_FILE=$(ls *.iso 2>/dev/null | head -n1)
          if [ -z "$ISO_FILE" ]; then
            echo "No ISO was produced -- see build.log" >&2
            exit 1
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          NEW_NAME="VoidOS-${SHORT_SHA}.iso"
          mv "$ISO_FILE" "$NEW_NAME"
          echo "ISO_NAME=$NEW_NAME" >> "$GITHUB_ENV"
          sha256sum "$NEW_NAME" > "$NEW_NAME.sha256"

      - name: Upload build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voidos-build-log
          path: build.log
          retention-days: 14

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO_NAME }}
          path: |
            ${{ env.ISO_NAME }}
            ${{ env.ISO_NAME }}.sha256
          retention-days: 30

      - name: Attach ISO to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ISO_NAME }}
            ${{ env.ISO_NAME }}.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
