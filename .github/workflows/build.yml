name: Build VoidOS ISO

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}   # lets you click "Run workflow" manually in the Actions tab

concurrency:
  group: build-voidos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ISO (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # IMPORTANT: run the whole job inside a real Debian bookworm container.
    # `apt-get install live-build` on the bare ubuntu-latest host pulls Ubuntu's
    # own `live-build` package, which is a ~2012 snapshot (3.0~a57) Ubuntu never
    # updated. It builds ISOs with the legacy genisoimage+isohybrid path instead
    # of xorriso, doesn't know isohybrid now lives in syslinux-utils, and fails
    # to stage isolinux.bin correctly - producing "isohybrid: not found" /
    # "cant find the boot image 'isolinux/isolinux.bin'" at the very last step.
    # Building inside debian:bookworm gets the current, correctly-behaving
    # live-build instead, which eliminates that whole class of bug.
    container:
      image: debian:bookworm
      # live-build needs to mount /proc and /dev/pts inside the chroot it's
      # building (and later mount loop devices for the squashfs/ISO stage).
      # GitHub Actions runs `container:` jobs as normal, unprivileged Docker
      # containers, which blocks those mount() calls with "permission denied"
      # even though the image and live-build version are both correct.
      # --privileged grants the container the capabilities (SYS_ADMIN, etc.)
      # those mounts need.
      options: --privileged

    steps:
      - name: Install git (needed for actions/checkout and later steps)
        # The debian:bookworm image ships nothing beyond the base system.
        # actions/checkout falls back to the GitHub REST API without git, but
        # a later step shells out to `git rev-parse`, so install it up front.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout VoidOS source
        uses: actions/checkout@v4

      - name: Install live-build and dependencies
        # Running as root inside the container already - no sudo needed/available.
        run: |
          apt-get update
          apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            syslinux-utils \
            dosfstools \
            mtools

      - name: Show live-build version
        run: lb --version || true

      - name: Clean any previous build state
        run: lb clean --purge
        working-directory: .

      - name: Generate live-build config from auto/config
        # lb build only reads config/ once it's been populated (distribution,
        # architecture, etc.). `lb config` alone only auto-runs auto/config if
        # that file is marked executable in the repo - which isn't guaranteed
        # (e.g. it's lost if files were pushed via GitHub's web upload instead
        # of `git push`). So we force the bit and call the script directly.
        run: |
          chmod +x auto/config
          ./auto/config
        working-directory: .

      - name: Verify the config targets Debian bookworm
        # Fail fast (instead of 30 minutes into a build) if auto/config didn't
        # actually apply. Live-build 3.x splits settings across config/bootstrap,
        # config/common etc. - LB_DISTRIBUTION lives in config/bootstrap, and
        # LB_MODE (which controls mirror/keyring - must be "debian", not the
        # host's own "ubuntu" default) lives in config/common.
        run: |
          MODE_OK=0; DIST_OK=0; SEC_OK=0
          grep -q '^LB_MODE="debian"' config/common 2>/dev/null && MODE_OK=1
          grep -q '^LB_DISTRIBUTION="bookworm"' config/bootstrap 2>/dev/null && DIST_OK=1
          grep -q '^LB_SECURITY="false"' config/bootstrap config/common config/chroot config/binary 2>/dev/null && SEC_OK=1
          if [ "$MODE_OK" != "1" ] || [ "$DIST_OK" != "1" ] || [ "$SEC_OK" != "1" ]; then
            echo "::error::auto/config did not apply correctly (mode_ok=$MODE_OK dist_ok=$DIST_OK sec_ok=$SEC_OK)."
            echo "--- config/bootstrap ---"; cat config/bootstrap 2>/dev/null || echo "(missing)"
            echo "--- config/common ---"; cat config/common 2>/dev/null || echo "(missing)"
            exit 1
          fi
          echo "Confirmed: Debian mode, targeting bookworm, security repo disabled."

      - name: Build the VoidOS ISO
        env:
          LB_APT_INDICES: "false"
        # `set -o pipefail` is a bash-ism. GitHub Actions defaults container
        # `run:` steps to `sh -e {0}`, and sh is dash inside debian:bookworm,
        # which doesn't understand -o pipefail ("Illegal option"). Force bash
        # explicitly so the pipefail + tee combo (needed so a failing `lb
        # build` still fails the step even though it's piped into `tee`)
        # actually works.
        shell: bash
        run: set -o pipefail; lb build 2>&1 | tee build.log
        working-directory: .

      - name: Rename ISO with version/commit info
        run: |
          ISO_FILE=$(ls *.iso 2>/dev/null | head -n1)
          if [ -z "$ISO_FILE" ]; then
            echo "No ISO was produced -- see build.log" >&2
            exit 1
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          NEW_NAME="VoidOS-${SHORT_SHA}.iso"
          mv "$ISO_FILE" "$NEW_NAME"
          echo "ISO_NAME=$NEW_NAME" >> "$GITHUB_ENV"
          sha256sum "$NEW_NAME" > "$NEW_NAME.sha256"

      - name: Upload build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voidos-build-log
          path: build.log
          retention-days: 14

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO_NAME }}
          path: |
            ${{ env.ISO_NAME }}
            ${{ env.ISO_NAME }}.sha256
          retention-days: 30

      - name: Attach ISO to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ISO_NAME }}
            ${{ env.ISO_NAME }}.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}