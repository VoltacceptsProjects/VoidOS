set timeout=3
set default=0

# Load every video backend GRUB has, on whichever firmware we booted from
# (efi_gop/efi_uga only exist under UEFI, vbe only under BIOS - GRUB just
# skips the modules that don't apply) and hand our kernel a linear
# framebuffer instead of relying on the legacy 0xB8000 text buffer, which
# does not exist on UEFI.
insmod all_video
insmod video
insmod gfxterm
insmod efi_gop
insmod efi_uga
insmod vbe

# VoidOS's GUI needs an actual graphics mode (a sidebar + cards don't fit
# in 80x25 text). Ask for a decent resolution and fall back gracefully if
# it isn't available: a couple of common sizes, then whatever GRUB is
# already using, then let it pick anything it can.
set gfxpayload=1024x768x32,800x600x32,keep,auto

# Every .vapp package under vapps/ at the repo root is copied to
# /boot/vapps/ at ISO build time (see the Makefile) and listed here as
# a Multiboot module. VoidOS has no network stack, so this - not a
# live download - is how it actually gets .vapp packages onto the ISO;
# voidfs_install_multiboot_modules() installs each one into VoidFS
# during boot. The packages themselves are synced from the online
# application directory: https://github.com/VoltacceptsProjects/VoidOS-Applications
# (see tools/sync-vapps.sh). Add a "module" line here for each new
# .vapp you want baked into the ISO.
menuentry "VoidOS" {
    multiboot /boot/voidos.bin
    module /boot/vapps/notepad.vapp
    boot
}
